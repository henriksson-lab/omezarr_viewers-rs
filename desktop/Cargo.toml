[package]
name = "omezarr-viewer-desktop"
version = "0.1.0"
edition = "2021"
description = "The OME-Zarr viewer as a desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
server = { path = "../server", package = "server" }
omezarr-viewer-common = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
actix-web = "4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
mime_guess = "2"
# `debug-embed`: without it a debug build reads `../dist` off disk at run time,
# so the binary works from the repository root and nowhere else. The bundle is
# the app; it must carry the frontend in both profiles.
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
