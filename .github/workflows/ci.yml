# Build, test and lint on the three platforms the app ships to.
#
# The desktop crate compiles the frontend into itself, so every job builds the
# WASM bundle first: `cargo build -p omezarr-viewer-desktop` fails without
# `dist/`, and that is the failure mode this catches early rather than at
# release time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Windows runners default to PowerShell, where `mkdir -p` is not a flag and a
# `&&` chain is not a chain. One shell everywhere means one set of steps.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure should not hide the others': a path-separator bug
      # shows up on Windows alone, and cancelling the rest would hide whether it
      # is the only one.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The desktop crate is the expensive one and it is not in
          # `default-members`, so name the workspace explicitly.
          workspaces: ". -> target"
          cache-all-crates: true

      # Tauri's Linux dependencies. macOS and Windows use the system webview.
      - name: Install the Linux webview dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev libxdo-dev

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build the frontend
        run: |
          mkdir -p app/assets
          cd app && trunk build --release

      # The whole workspace, not `-p server`: the shared crate holds the
      # geometry — hit testing, holes, the hierarchy rule, vertex editing — and
      # naming one crate is how those went untested for as long as they did.
      - name: Test
        run: cargo test --workspace

      # Likewise for lints: a dependency is *not* linted when its dependent is,
      # so a fourth crate added later would arrive unlinted.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The frontend again, for the target it actually ships on: a wasm-only
      # path is not compiled by the host lint above.
      - name: Lint the frontend for wasm
        working-directory: app
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      # Clippy checks but does not link; the build is what proves the binary
      # comes out the other end with the frontend inside it.
      - name: Build the desktop app
        run: cargo build -p omezarr-viewer-desktop

      # A real gate since it proved stable: the frontend's unit tests cover the
      # pure parts, but every drawing tool, every edit gesture, the label
      # painting and the table view are verified *only* here, by driving a
      # browser and asserting on pixels. Linux only: it needs a GPU-less WebGL2,
      # which means SwiftShader.
      #
      # `timeout-minutes` because the failure mode of a browser test is a hang,
      # not a failure — a gate that never reports is worse than one that fails.
      # The suites take about two minutes here; the rest is headroom for a
      # runner slower than this machine.
      - name: Test the frontend in a browser
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          python3 -m pip install --quiet websocket-client pillow
          cargo build --bin server --bin make_demo
          python3 tests/browser/run.py

  formatting:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
