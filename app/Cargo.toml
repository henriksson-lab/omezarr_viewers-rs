[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
omezarr-viewer-common = { path = ".." }
yew = { version = "0.21", features = ["csr"] }
gloo-net = "0.6"
gloo-timers = "0.3"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it serde_json's float parser is fast but not
# correctly rounded, so a coordinate read back from the server could land a
# ULP away from the one it stored — and the next save wrote the drift back.
# The server gets this feature transitively; the frontend has to ask.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Ear-clipping triangulation, for filled polygons with holes. Pure Rust, no
# dependencies of its own, and the only thing between an outline and a fill.
earcut = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"
wasm-logger = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlBuffer",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "MouseEvent",
  "WheelEvent",
  "KeyboardEvent",
  "BeforeUnloadEvent",
  "EventTarget",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "CssStyleDeclaration",
  "DomRect",
  "Location",
  "HtmlSelectElement",
  "TouchEvent",
  "TouchList",
  "Touch",
  "Blob",
  "Url",
  "HtmlAnchorElement",
]
