[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
name = "omezarr_viewer_server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
omezarr-viewer-common = { path = ".." }
actix-web = "4"
actix-files = "0.6"
zarrs = { version = "0.18", features = ["filesystem", "async"] }
zarrs_opendal = "0.7"
opendal = { version = "0.53", features = ["services-http", "services-s3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = "0.4"
env_logger = "0.11"
csv = "1"
# Read-only, and without `arrow`: the record iterator is all a few hundred rows
# of somebody else's ROI table needs, and the arrow stack is a lot of crates to
# carry for it.
parquet = { version = "59", default-features = false, features = ["snap", "flate2-rust_backend", "zstd", "brotli", "lz4"] }
bytes = "1"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"
# The parquet *writer*, for building a fixture the reader is asked to open.
parquet = { version = "59", default-features = false, features = ["snap"] }
