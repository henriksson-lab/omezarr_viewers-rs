[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
omezarr-viewer-common = { path = ".." }
actix-web = "4"
actix-files = "0.6"
zarrs = { version = "0.18", features = ["filesystem", "async"] }
zarrs_opendal = "0.7"
opendal = { version = "0.53", features = ["services-http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = "0.4"
env_logger = "0.11"
